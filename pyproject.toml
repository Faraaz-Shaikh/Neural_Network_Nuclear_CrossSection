[project]
name = "nn-nuclear-xs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Danish Shakeel Mohammad", email = "mohammadsdanish@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "pytest-cov>=7.1.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.scripts]
nn-nuclear-xs = "nn_nuclear_xs:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 99

# this excludes ruff from acting on the listed files and folders
# extend-exclude = [
#     "src/sudoku_generator/utils/tdoku.py",
# ]

# the TC type checking rules assume that a name that appears only in annotations is never touched at runtime, so moving it into an if TYPE_CHECKING: block saves import time and breaks circular imports. That premise is true only when nothing evaluates annotations at runtime. Beartype voids it completely. Have not yet added beartype to this project, so have included TC
[tool.ruff.lint]
# see: https://docs.astral.sh/ruff/rules/
select = ["ALL"]
ignore = [
    'COM812',      # Trailing comma missing - can cause conflicts with formatter
    'D203',        # 1 blank line required before class docstring - conflict
    'D213',        # Multi-line docstring summary should start at the second line - conflict with D212
    'ERA001',      # Found commented out code
    'EXE002',      # The file is executable but no shebang is present
    'FIX002',      # Line contains TODO, consider resolving the issue
    # 'PLR0913',     # Too many arguments in function definition - can't use with injector
    # 'PLR0917',     # Too many positional arguments - can't use with injector
    'T201',        # print statement not allowed
    # 'TC001',       # Move application import {} into a type-checking block - conflicts with beartype
    # 'TC002',       # Move third-party import {} into a type-checking block - conflicts with beartype
    # 'TC003',       # Move standard library import {} into a type-checking block - conflicts with beartype
]

[tool.ruff.lint.isort]
known-first-party = ["nn_nuclear_xs"]
combine-as-imports = true

# if you do import ipdb; ipdb.set_trace() it will now show 15 lines of context by default
[tool.ipdb]
context=15

[tool.coverage.run]
source = ["src/nn_nuclear_xs"]
branch = true
omit = ["*/tests/*", "*/__init__.py", "*/exploration/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2

[tool.pytest.ini_options]
# anything in add opts (options) gets added to the pytest command.
addopts = [
    # -ra: show short summary of all non-passing tests at the end
    "-ra",
    # -v:  show each test name and its pass/fail status
    "-v",
    # the import mode controls how pytest imports modules. by default, the imports are done by adding the parent directory prepended to the sys.path. importlib means that sys.path is not touched and importlib module is used instead for imports. This (importlib) is the modern recommendation.
    "--import-mode=importlib",
    # --cov=frag: that tells pytest-cov to track coverage of my package
    "--cov=nn_nuclear_xs",
    # this creates a html report where you can actually look at the file and see which lines are covered and which not
    # "--cov-report=html:reports/htmlcov",
    # this adds a terminal report with an extra column showing missing line numbers and it also skips files which are 100% covered
    "--cov-report=term-missing:skip-covered"
]
# this tells pytest where to search for test files - by restricting to tests folder we ensure that things are a little faster - pytest does not spend time walking through src folder
testpaths = ["tests"]
